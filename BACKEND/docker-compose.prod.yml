services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wanti/backend:${IMAGE_TAG:-latest}
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      RUN_MIGRATIONS: "true"
    env_file:
      - .env.production
    volumes:
      - static_volume:/home/app/code/staticfiles
      - media_volume:/home/app/code/media
    depends_on:
      - redis
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1'
          memory: 1G

  celery-worker:
    image: wanti/backend:${IMAGE_TAG:-latest}
    restart: always
    command: >
      celery -A app worker
      --loglevel=info
      --queues=high,default,low
      --concurrency=4
      --max-tasks-per-child=1000
      --time-limit=300
      --soft-time-limit=240
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      RUN_MIGRATIONS: "false"
    env_file:
      - .env.production
    depends_on:
      - redis
    deploy:
      replicas: 2

  celery-beat:
    image: wanti/backend:${IMAGE_TAG:-latest}
    restart: always
    command: >
      celery -A app beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      RUN_MIGRATIONS: "false"
    env_file:
      - .env.production
    depends_on:
      - redis
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
    depends_on:
      - api

volumes:
  redis_data:
  static_volume:
  media_volume:
