# Single-server production stack (EC2 bootstrap).
# Postgres + Redis stay on the internal Docker network (no host ports).
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: wanti-postgres
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME:-wanti_prod}
      POSTGRES_USER: ${DB_USER:-wanti_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wanti_app} -d ${DB_NAME:-wanti_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wanti-redis
    restart: always
    env_file:
      - .env.production
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wanti/backend:server
    container_name: wanti-api
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      RUN_MIGRATIONS: "true"
    env_file:
      - .env.production
    volumes:
      - static_volume:/home/app/code/staticfiles
      - media_volume:/home/app/code/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    image: wanti/backend:server
    container_name: wanti-celery-worker
    restart: always
    command: >
      celery -A app worker
      --loglevel=info
      --queues=high,default,low
      --concurrency=2
      --max-tasks-per-child=500
      --time-limit=300
      --soft-time-limit=240
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      RUN_MIGRATIONS: "false"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    image: wanti/backend:server
    container_name: wanti-celery-beat
    restart: always
    command: >
      celery -A app beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: app.settings.production
      RUN_MIGRATIONS: "false"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: wanti-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.bootstrap.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/var/www/staticfiles:ro
      - media_volume:/var/www/media:ro
      - ./admin-panel:/var/www/panel:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
